<div id="cartOverlay" class="cart-overlay"></div>
<div id="cartDeleteDialog" class="cart-delete-dialog" style="display:none;">
  <div class="cart-delete-dialog-content">
    <div class="cart-delete-dialog-title">האם למחוק את המוצר מהעגלה?</div>
    <div class="cart-delete-dialog-actions">
      <button id="cartDeleteYes" class="cart-delete-btn-yes" aria-label="כן, מחק את המוצר מהעגלה">כן</button>
      <button id="cartDeleteNo" class="cart-delete-btn-no" aria-label="לא, אל תמחק את המוצר מהעגלה">לא</button>
    </div>
  </div>
</div>
<aside id="sideCart" class="side-cart">
  <div class="side-cart-header">
    <span class="side-cart-title">סל קניות</span>
    <button class="side-cart-close" id="closeSideCart" aria-label="סגור סל קניות">×</button>
  </div>
  <div class="side-cart-list" id="sideCartList"></div>
  <button class="side-cart-view-btn" id="viewCartBtn" aria-label="לצפייה בסל הקניות">לצפייה בסל הקניות</button>
</aside>
