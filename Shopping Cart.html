  <script>
// Global variables and functions
let bigCart = [];
let deleteDialogIdx = null;

// Parse price robustly: supports strings like "₪ 350", with commas, NBSP and RTL chars
function parsePriceToNumber(priceValue) {
  if (typeof priceValue === 'number') return priceValue;
  if (!priceValue) return 0;
  try {
    const str = priceValue.toString();
    // Remove everything except digits and decimal point
    const cleaned = str.replace(/[^0-9.]/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
  } catch (e) {
    return 0;
  }
}

function resolveCartImageUrl(rawImage) {
  if (window.cartSync && typeof window.cartSync.resolveCartImageUrl === 'function') {
    return window.cartSync.resolveCartImageUrl(rawImage);
  }
  return { primary: rawImage || '', fallback: rawImage || '' };
}

function buildCartItemImageHtml(item, idx) {
  const rawImage = item.img || item.image || item.mainImage;
  const altText = item.subtitle ? `${item.title} | ${item.subtitle}` : (item.title || 'מוצר');
  if (!rawImage) {
    return '<div class="big-cart-item-img big-cart-item-img--empty" aria-hidden="true"></div>';
  }
  const urls = resolveCartImageUrl(rawImage);
  const safeAlt = altText.replace(/"/g, '&quot;');
  const safePrimary = (urls.primary || '').replace(/"/g, '&quot;');
  const safeFallback = (urls.fallback || '').replace(/"/g, '&quot;');
  return `<img class="big-cart-item-img" data-img-id="img-${idx}" src="${safePrimary}" data-fallback="${safeFallback}" alt="${safeAlt}">`;
}

function canUseCartImageFallback(url) {
  if (window.cartSync && typeof window.cartSync.isAllowedCartImageSrc === 'function') {
    return window.cartSync.isAllowedCartImageSrc(url);
  }
  if (!url || url.startsWith('data:')) return !!url;
  try {
    return new URL(url, window.location.href).origin === window.location.origin;
  } catch (e) {
    return false;
  }
}

function bindCartItemImageFallback(row) {
  const imgEl = row.querySelector('.big-cart-item-img[src]');
  if (!imgEl) return;
  imgEl.addEventListener('error', function handleCartImageError() {
    const fallback = this.dataset.fallback;
    if (fallback && canUseCartImageFallback(fallback) && fallback !== this.getAttribute('src') && this.src !== fallback && !this.dataset.fallbackUsed) {
      this.dataset.fallbackUsed = '1';
      this.src = fallback;
      return;
    }
    this.classList.add('big-cart-item-img--empty');
    this.removeAttribute('src');
  });
}

function updateQuantity(idx, change) {
  if (bigCart[idx]) {
    const newQty = bigCart[idx].qty + change;
    if (newQty >= 1) {
      bigCart[idx].qty = newQty;
      saveBigCartToStorage(bigCart);
      renderBigCart();
      updateTotalPrice();
      if (window.cartSync && typeof window.cartSync.synchronize === 'function') {
        window.cartSync.synchronize('big-cart-quantity-change');
      }
      
      // החזרת הפוקוס לכפתור שהפעלנו
      setTimeout(() => {
        const cartItems = document.querySelectorAll('.big-cart-item');
        if (cartItems[idx]) {
          const buttons = cartItems[idx].querySelectorAll('.qty-btn');
          if (change > 0 && buttons[1]) {
            buttons[1].focus(); // plus button
          } else if (change < 0 && buttons[0]) {
            buttons[0].focus(); // minus button
          }
        }
      }, 100);
    } else if (newQty === 0) {
      showDeleteDialog(idx);
    }
  }
}

function saveBigCartToStorage(bigCart) {
  try {
    localStorage.setItem('cart', JSON.stringify(bigCart));
  } catch (e) {
    console.error('Failed to save cart to localStorage:', e);
  }
}

function loadBigCartFromStorage() {
  if (window.cartSync && typeof window.cartSync.loadCart === 'function') {
    return window.cartSync.loadCart();
  }
  try {
    const cartData = localStorage.getItem('cart');
    if (cartData) {
      const parsedCart = JSON.parse(cartData);
      if (Array.isArray(parsedCart)) {
        return parsedCart;
      }
    }
  } catch (e) {
    console.error('Failed to parse cart from localStorage:', e);
  }
  return [];
}

function updateTotalPrice() {
  let total = 0;
  let hasCustomProduct = false;
  
  bigCart.forEach(item => {
    if (item.title?.includes('עיצוב אישי')) {
      hasCustomProduct = true;
    } else if (item.price) {
      const priceNumber = parsePriceToNumber(item.price);
      if (!isNaN(priceNumber)) {
        total += priceNumber * item.qty;
      }
    }
  });

  // הוספת מחיר משלוח אם נבחר משלוח
  const selectedShipping = document.querySelector('.shipping-option-btn.active')?.getAttribute('data-value');
  const shippingCost = selectedShipping === 'delivery' ? 50 : 0;
  
  // חישוב המחיר הכולל כולל משלוח
  const totalWithShipping = total + shippingCost;
  
  const totalElem = document.getElementById('bigCartTotal');
  if (totalElem) {
    if (hasCustomProduct) {
      if (totalWithShipping > 0) {
        totalElem.textContent = `₪${totalWithShipping} + הצעת מחיר תשלח בהמשך`;
      } else {
        totalElem.textContent = 'הצעת מחיר תשלח בהמשך';
      }
    } else {
      totalElem.textContent = '₪' + totalWithShipping;
    }
  }
}

function renderBigCart() {
  const list = document.getElementById('bigCartList');
  const orderBtn = document.getElementById('bigCartOrderBtn');
  
  if (!list) {
    console.error('bigCartList element not found');
    return;
  }
  list.innerHTML = '';
  
  // עדכון מצב הכפתור בהתאם לתוכן הסל
  if (orderBtn) {
    if (bigCart.length === 0) {
      orderBtn.disabled = true;
      orderBtn.style.opacity = '0.5';
      orderBtn.style.cursor = 'not-allowed';
      orderBtn.textContent = 'הסל ריק';
    } else {
      orderBtn.disabled = false;
      orderBtn.style.opacity = '1';
      orderBtn.style.cursor = 'pointer';
      orderBtn.textContent = 'להמשך להזנת פרטים';
    }
  }
  
  if (bigCart.length === 0) {
    list.innerHTML = '<div style="text-align: center; padding: 20px; font-family: \'Amatica SC\', cursive; font-size: 20px; color: #8B6B47;">העגלה ריקה</div>';
    return;
  }
  
  bigCart.forEach((item, idx) => {
    try {
      let isCustom = item.title && item.title.includes('עיצוב אישי');
      let priceCell;
      if (isCustom) {
        priceCell = `<div class='custom-price'>המחיר יקבע בהצעת מחיר</div>`;
      } else if (item.price) {
        const priceNumber = parsePriceToNumber(item.price);
        if (!isNaN(priceNumber)) {
          priceCell = `<div class='big-cart-item-price'>₪${priceNumber * item.qty}</div>`;
        } else {
          priceCell = `<div class='big-cart-item-price'>₪0</div>`;
        }
      } else {
        priceCell = `<div class='big-cart-item-price'>₪0</div>`;
      }
      let notes = '';
      try {
        if (window.cartSync && typeof window.cartSync.renderCartNotes === 'function') {
          notes = window.cartSync.renderCartNotes(item, true);
        } else if (item.notes) {
          notes = item.notes;
        }
      } catch (error) {
        console.error('Error rendering cart notes:', error);
        notes = item.notes || '';
      }
      const row = document.createElement('div');
      row.className = 'big-cart-item';
      row.innerHTML = `
        <button class="big-cart-item-remove" title="הסר"><span class="big-cart-item-trash-icon"></span></button>
        ${buildCartItemImageHtml(item, idx)}
        <div class="big-cart-item-info">
          <div class="big-cart-item-title">${item.subtitle ? `${item.title} | ${item.subtitle}` : item.title}</div>
          <div class="big-cart-item-notes">${notes || ''}</div>
        </div>
        <div class="big-cart-item-qty">
          <button class="qty-btn minus-btn"></button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn plus-btn"></button>
        </div>
        ${priceCell}
      `;
      bindCartItemImageFallback(row);
      
      const minusBtn = row.querySelector('.minus-btn');
      const plusBtn = row.querySelector('.plus-btn');
      
      minusBtn.addEventListener('click', (e) => {
        e.preventDefault();
        updateQuantity(idx, -1);
      });
      
      plusBtn.addEventListener('click', (e) => {
        e.preventDefault();
        updateQuantity(idx, 1);
      });
      
      // הוספת תמיכה במקלדת לכפתורי הכמות
      minusBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          updateQuantity(idx, -1);
        }
      });
      
      plusBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          updateQuantity(idx, 1);
        }
      });

      row.querySelector('.big-cart-item-remove').addEventListener('click', function() {
        showDeleteDialog(idx);
      });
      
      // הוספת תמיכה במקלדת לכפתור המחיקה
      row.querySelector('.big-cart-item-remove').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          showDeleteDialog(idx);
        }
      });
      
      list.appendChild(row);
      
      // עדכן את הסכום בכל שינוי בכמות דרך כפתורי הפלוס/מינוס
      // הקריאות ל-updateQuantity כבר עושות renderBigCart + updateTotalPrice,
      // אך נוסיף עדכון בטוח כדי לטפל במקרי קצה של דפדפנים איטיים
      minusBtn.addEventListener('click', () => setTimeout(updateTotalPrice, 0));
      plusBtn.addEventListener('click', () => setTimeout(updateTotalPrice, 0));
    } catch (error) {
      console.error('Error rendering cart notes:', error);
    }
  });
  
  updateTotalPrice();
}

function removeItem(idx) {
  bigCart.splice(idx, 1);
  saveBigCartToStorage(bigCart);
  renderBigCart();
  updateTotalPrice();
  if (window.cartSync && typeof window.cartSync.synchronize === 'function') {
    window.cartSync.synchronize('big-cart-item-removed');
  }
}

function showDeleteDialog(idx) {
  deleteDialogIdx = idx;
  
  // שמירת האלמנט שממנו הגענו לדיאלוג
  const lastFocusedElement = document.activeElement;
  
  let dialog = document.getElementById('bigCartDeleteDialog');
  if (!dialog) {
    dialog = document.createElement('div');
    dialog.id = 'bigCartDeleteDialog';
    dialog.innerHTML = `
      <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.18);z-index:200;display:flex;align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:12px;box-shadow:0 2px 16px #0003;padding:32px 28px 18px 28px;min-width:260px;text-align:center;">
          <div style="font-family:'Amatica SC',cursive;font-size:22px;color:#8B6B47;margin-bottom:18px;">האם למחוק את המוצר מהעגלה?</div>
          <div style="display:flex;justify-content:center;gap:18px;">
            <button id="bigCartDeleteYes" style="background:#e74c3c;color:#fff;border:none;border-radius:8px;font-size:18px;font-family:'Amatica SC',cursive;padding:6px 22px;cursor:pointer;">כן</button>
            <button id="bigCartDeleteNo" style="background:#eee;color:#8B6B47;border:none;border-radius:8px;font-size:18px;font-family:'Amatica SC',cursive;padding:6px 22px;cursor:pointer;">לא</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(dialog);
  } else {
    dialog.style.display = 'flex';
  }
  
  // העברת פוקוס לכפתור "כן"
  setTimeout(() => {
    const yesBtn = document.getElementById('bigCartDeleteYes');
    if (yesBtn) {
      yesBtn.focus();
    }
  }, 100);
  
  // הוספת מאזיני מקלדת לכפתורי הדיאלוג
  const yesBtn = document.getElementById('bigCartDeleteYes');
  const noBtn = document.getElementById('bigCartDeleteNo');
  
  if (yesBtn) {
    yesBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (deleteDialogIdx !== null) {
          removeItem(deleteDialogIdx);
          deleteDialogIdx = null;
        }
        dialog.style.display = 'none';
        // החזרת הפוקוס לאלמנט המקורי
        setTimeout(() => {
          if (lastFocusedElement) {
            lastFocusedElement.focus();
          }
        }, 100);
      }
    });
  }
  
  if (noBtn) {
    noBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        deleteDialogIdx = null;
        dialog.style.display = 'none';
        // החזרת הפוקוס לאלמנט המקורי
        setTimeout(() => {
          if (lastFocusedElement) {
            lastFocusedElement.focus();
          }
        }, 100);
      }
    });
  }
  
  // לכידת פוקוס בתוך הדיאלוג
  dialog.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      const focusableElements = dialog.querySelectorAll('button');
      const firstElement = focusableElements[0];
      const lastElement = focusableElements[focusableElements.length - 1];
      
      if (e.shiftKey) {
        // Shift + Tab
        if (document.activeElement === firstElement) {
          e.preventDefault();
          lastElement.focus();
        }
      } else {
        // Tab
        if (document.activeElement === lastElement) {
          e.preventDefault();
          firstElement.focus();
        }
      }
    }
  });
  
  document.getElementById('bigCartDeleteYes').onclick = function() {
    if (deleteDialogIdx !== null) {
      removeItem(deleteDialogIdx);
      deleteDialogIdx = null;
    }
    dialog.style.display = 'none';
    // החזרת הפוקוס לאלמנט המקורי
    setTimeout(() => {
      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }, 100);
  };
  document.getElementById('bigCartDeleteNo').onclick = function() {
    deleteDialogIdx = null;
    dialog.style.display = 'none';
    // החזרת הפוקוס לאלמנט המקורי
    setTimeout(() => {
      if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    }, 100);
  };
}

function saveBigCartNotes() {
  const notes = document.getElementById('bigCartNotes').value;
  localStorage.setItem('bigCartNotes', notes);
}

function loadBigCartNotes() {
  const notes = localStorage.getItem('bigCartNotes') || '';
  const notesField = document.getElementById('bigCartNotes');
  if (notesField) {
    notesField.value = notes;
  }
}

function saveShippingMethod() {
  const selectedShipping = document.querySelector('.shipping-option-btn.active')?.getAttribute('data-value');
  if (selectedShipping) {
    localStorage.setItem('shippingMethod', selectedShipping);
  }
}

function loadShippingMethod() {
  const savedShipping = localStorage.getItem('shippingMethod');
  if (savedShipping) {
    const button = document.querySelector(`.shipping-option-btn[data-value="${savedShipping}"]`);
    if (button) {
      // הסרת active מכל הכפתורים
      document.querySelectorAll('.shipping-option-btn').forEach(b => {
        b.classList.remove('active');
      });
      // הוספת active לכפתור הנכון
      button.classList.add('active');
    }
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // --- Big Cart Logic ---
  bigCart = loadBigCartFromStorage();
  
  // בדיקה אם יש מוצרים בסל
  if (bigCart.length > 0) {
  }

  function getColorFromName(name) {
    const colors = {
      'תכלת': '#7ed6f7',
      'טורקיז': '#40e0d0',
      'אדום': '#e74c3c',
      'כחול': '#2980b9',
      'ירוק': '#27ae60',
      'צהוב': '#f9e79f',
      'שחור': '#222',
      'לבן': '#fff',
      'כתום': '#f39c12',
      'סגול': '#8e44ad',
      'ורוד': '#fd79a8',
      'חום': '#a0522d',
      'אפור': '#7f8c8d',
      'זהב': '#ffd700',
      'כסף': '#bdc3c7',
    };
    return colors[name.trim()] || '#b2bec3';
  }

  // בדיקת אלמנטים
  const list = document.getElementById('bigCartList');
  const orderBtnElement = document.getElementById('bigCartOrderBtn');
  
  renderBigCart();
  loadBigCartNotes();
  loadShippingMethod();
  updateTotalPrice(); // עדכון המחיר הכולל בטעינת העמוד

  window.addEventListener('storage', function(e) {
    if (e.key === 'cart') {
      try {
        bigCart = loadBigCartFromStorage();
        renderBigCart();
        updateTotalPrice(); // עדכון המחיר כשהסל מתעדכן מה-storage
      } catch (error) {
        console.error('Error syncing big cart from storage:', error);
      }
    }
  });

  window.addEventListener('focus', function() {
    try {
      bigCart = loadBigCartFromStorage();
      renderBigCart();
      updateTotalPrice(); // עדכון המחיר כשהסל מתעדכן מה-storage
    } catch (error) {
      console.error('Error syncing big cart on focus:', error);
    }
  });

  // הוספת event listeners לכפתורי שיטת המשלוח
  document.querySelectorAll('.shipping-option-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      // הסרת active מכל הכפתורים
      document.querySelectorAll('.shipping-option-btn').forEach(b => {
        b.classList.remove('active');
      });
      // הוספת active לכפתור הנוכחי
      this.classList.add('active');
      
      // שמירת הבחירה
      const selectedValue = this.getAttribute('data-value');
      localStorage.setItem('shippingMethod', selectedValue);
      updateTotalPrice();
    });
    
    // הוספת תמיכה במקלדת לכפתורים
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.click();
      }
    });
  });

  const orderBtn = document.getElementById('bigCartOrderBtn');
  if (orderBtn) {
    orderBtn.onclick = function() {
      // בדיקה אם יש מוצרים בסל
      if (bigCart.length === 0) {
        alert('הסל ריק. אנא הוסף מוצרים לפני המשך ההזמנה.');
        return;
      }
      
      const shipping = document.querySelector('.shipping-option-btn.active')?.getAttribute('data-value');
      const notes = document.getElementById('bigCartNotes')?.value;
      
      localStorage.setItem('cart', JSON.stringify(bigCart));
      localStorage.setItem('deliveryMethod', shipping === 'delivery' ? 'delivery' : 'pickup');
      localStorage.setItem('notes', notes || '');
      localStorage.setItem('bigCartNotes', notes || '');
      
      window.location.href = 'Order.html';
    };
    
    // הוספת תמיכה במקלדת לכפתור ההזמנה
    orderBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        orderBtn.click();
      }
    });
  }
});
</script>
